# Include inside the TLS server for api.actorconsole.com.
# Public read-only rendering uses the existing Node frontend.
location = /__catalog_render/health {
    limit_except GET HEAD { deny all; }
    proxy_set_header Host actorconsole.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:4202/api/health;
    add_header Cache-Control "no-store" always;
}

location ^~ /__catalog_render/ {
    if ($uri !~ "^/__catalog_render/builders/(?!compare(?:/|$))[A-Za-z0-9_.-]+(?:/actors/[A-Za-z0-9_.-]+)?$") {
        return 404;
    }
    limit_except GET HEAD { deny all; }
    rewrite ^/__catalog_render(/builders/.*)$ $1 break;
    proxy_http_version 1.1;
    proxy_set_header Host actorconsole.com;
    proxy_set_header X-Forwarded-Host actorconsole.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Admin-Api-Key "";
    proxy_set_header X-Api-Key "";
    proxy_set_header X-Session-Token "";
    proxy_set_header RSC "";
    proxy_set_header Next-Action "";
    proxy_set_header Next-Router-State-Tree "";
    proxy_set_header Next-Router-Prefetch "";
    proxy_set_header Next-Router-Segment-Prefetch "";
    proxy_set_header Next-Url "";
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://127.0.0.1:4202;
}

location ^~ /_next/static/ {
    limit_except GET HEAD { deny all; }
    proxy_set_header Host actorconsole.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass http://127.0.0.1:4202;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}
