# Optional HTTP bootstrap for an explicitly restored VPS web-fallback service.
# Normal production frontend hosting is Vercel; do not install this for releases.
# Certbot can add the HTTPS listener after DNS for app.example.com and
# www.example.com resolves to this VPS.
server {
    server_name app.example.com www.example.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 10m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:4202;
    }
}
