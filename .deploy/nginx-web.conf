# HTTP bootstrap for the VPS Next.js frontend on loopback port 4202.
# Replace these example hostnames, then let Certbot add HTTPS. Existing TLS
# installations should retain their certificate directives when changing upstreams.
server {
    server_name app.example.com www.example.com;
    listen 80;
    listen [::]:80;

    client_max_body_size 10m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:4202;
    }
}
