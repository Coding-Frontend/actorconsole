name: Release containers

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'Coding-Frontend/actorconsole' && !github.event.deleted && (vars.ENABLE_CONTAINER_RELEASES == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.review.outputs.revision }}
      tag: ${{ steps.review.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Require main ancestry and successful checks for this exact revision
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-container-release.mjs

  build:
    name: Build and check ${{ matrix.target }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.revision }}
          persist-credentials: false
      - name: Build, check and save the immutable image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build --target "$TARGET" --tag "actorconsole-release:$TARGET" .
          docker run --rm --network none --entrypoint node "actorconsole-release:$TARGET" --check "apps/$TARGET/dist/index.js"
          mkdir release
          docker image inspect --format '{{.Id}}' "actorconsole-release:$TARGET" > release/image-id
          docker save "actorconsole-release:$TARGET" -o release/image.tar
          (cd release && sha256sum image.tar > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish checked ${{ matrix.target }} image
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: containers
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, mcp]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-${{ matrix.target }}
          path: release
      - name: Verify and promote the checked image without rebuilding
        env:
          TARGET: ${{ matrix.target }}
          REVISION: ${{ needs.authorize.outputs.revision }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check --strict SHA256SUMS)
          image_id="$(cat release/image-id)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load -i release/image.tar
          test "$(docker image inspect --format '{{.Id}}' "actorconsole-release:$TARGET")" = "$image_id"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/actorconsole-$TARGET"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$image_id" "$image:sha-${REVISION:0:12}"
          docker push "$image:sha-${REVISION:0:12}"
          docker tag "$image_id" "$image:$RELEASE_TAG"
          docker push "$image:$RELEASE_TAG"
