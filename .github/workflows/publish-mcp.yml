name: Publish MCP to npm

on:
  push:
    tags: ["mcp-v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-mcp.yml
      - apps/mcp/**
      - packages/shared/**
      - scripts/mcp-release*
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: npm-mcp-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: MCP package checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !github.event.deleted && github.repository == 'Coding-Frontend/actorconsole')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      tarball: ${{ steps.release.outputs.tarball }}
      sha512: ${{ steps.digest.outputs.sha512 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate package and release tag
        id: release
        env:
          IS_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          if [[ "$IS_RELEASE" == true ]]; then
            node scripts/mcp-release.mjs "$GITHUB_REF"
            git merge-base --is-ancestor HEAD origin/main
          else
            node scripts/mcp-release.mjs
          fi
      - name: Require successful main CI and secret scanning
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 1200))
          for workflow in ci.yml secrets.yml; do
            passed=false
            while (( SECONDS < deadline )); do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$revision&branch=main&event=push&per_page=20")"
              if jq -e --arg sha "$revision" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' <<<"$result" >/dev/null; then
                passed=true
                break
              fi
              if jq -e '.workflow_runs | length > 0 and all(.status == "completed")' <<<"$result" >/dev/null; then
                echo "$workflow has no successful run for the tagged main commit" >&2
                exit 1
              fi
              sleep 30
            done
            [[ "$passed" == true ]] || { echo "Timed out waiting for $workflow" >&2; exit 1; }
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @actorconsole/shared build
      - run: pnpm --filter @actorconsole/mcp typecheck
      - run: pnpm --filter @actorconsole/mcp lint
      - run: pnpm --filter @actorconsole/mcp test
      - run: node --test scripts/mcp-release.test.mjs
      - name: Build, pack and test the installable tarball
        working-directory: apps/mcp
        run: npm run test:package
      - name: Validate npm publication without publishing
        if: github.event_name == 'push'
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish "$GITHUB_WORKSPACE/.cache/npm-release/$TARBALL" --dry-run --access public --ignore-scripts --tag "$DIST_TAG" --registry https://registry.npmjs.org
      - name: Record the tested artifact digest
        id: digest
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          echo "sha512=$(sha512sum ".cache/npm-release/$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: mcp-npm-package
          path: .cache/npm-release/${{ steps.release.outputs.tarball }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tested MCP tarball
    if: github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/mcp-v') && github.repository == 'Coding-Frontend/actorconsole'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Verify and publish the exact tested package with OIDC
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED_SHA512: ${{ needs.package.outputs.sha512 }}
          DIST_TAG: ${{ needs.package.outputs.dist-tag }}
        run: |
          [[ "$EXPECTED_SHA512" =~ ^[0-9a-f]{128}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA512" "release/$TARBALL" | sha512sum --check --strict
          npm publish "$GITHUB_WORKSPACE/release/$TARBALL" --access public --provenance --ignore-scripts --tag "$DIST_TAG" --registry https://registry.npmjs.org
      - name: Verify published integrity and provenance
        env:
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA512: ${{ needs.package.outputs.sha512 }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {setTimeout} from 'node:timers/promises';
          const expected = 'sha512-' + Buffer.from(process.env.EXPECTED_SHA512, 'hex').toString('base64');
          const endpoint = `https://registry.npmjs.org/@actorconsole%2fmcp/${encodeURIComponent(process.env.VERSION)}`;
          const attempts = 60;
          for (let attempt = 1; attempt <= attempts; attempt++) {
            let response;
            try {
              response = await fetch(endpoint, {
                headers: {'cache-control': 'no-cache'},
                signal: AbortSignal.timeout(10000),
              });
            } catch (error) {
              if (!(error instanceof TypeError) && error.name !== 'TimeoutError') throw error;
              console.log('Registry request temporarily unavailable.');
            }
            if (response?.ok) {
              const published = await response.json();
              assert.equal(published.name, '@actorconsole/mcp');
              assert.equal(published.version, process.env.VERSION);
              assert.equal(published.dist.integrity, expected, 'Published tarball differs from the tested artifact');
              if (published.dist.attestations?.provenance) {
                console.log('Published package integrity and provenance verified.');
                process.exit(0);
              }
            } else if (response) {
              assert([404, 408, 429, 500, 502, 503, 504].includes(response.status), `Unexpected registry HTTP ${response.status}`);
            }
            if (attempt < attempts) {
              console.log(`Waiting for npm processing and provenance (${attempt}/${attempts})...`);
              await setTimeout(15000);
            }
          }
          throw new Error('npm did not expose the published package with provenance within the verification window');
          NODE
