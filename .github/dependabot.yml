version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Match the Node 22 runtime in Docker and CI.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Keep the Babel-based React plugin until the Vitest/Oxc migration.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
      # BullMQ 5 depends on ioredis 5; v6 changes the default wire protocol.
      - dependency-name: ioredis
        versions: [">=6"]
      # Billing API changes require a tested Stripe API migration.
      - dependency-name: stripe
        versions: [">=23"]
      # Queue backend and chart interaction migrations need dedicated review.
      - dependency-name: bullmq
        versions: [">=6"]
      - dependency-name: recharts
        versions: [">=3"]
      # Prisma 7 requires a driver-adapter and connection-pool migration.
      - dependency-name: "@prisma/client"
        versions: [">=7"]
      - dependency-name: prisma
        versions: [">=7"]
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
